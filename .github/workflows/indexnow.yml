# After every production deployment on Vercel, tell IndexNow which pages changed
# (see scripts/indexnow.mjs). Nothing runs on preview deployments.
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
