# After every push to main, tell IndexNow which pages changed (scripts/indexnow.mjs).
# The push is also what makes Vercel deploy, so the script first waits until veodar.com
# serves this commit (it reads /version.txt) and only then reads the live sitemap.
# The sitemap announced last time is kept in the Actions cache, so a deployment that
# changes no page announces nothing. It can also be run by hand from the Actions tab.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: 'Enviar todas las URL del sitemap, no solo las que cambiaron'
        type: boolean
        default: false

permissions:
  contents: read

# A newer push replaces the one still waiting: its run announces both.
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the last saved memory and, if the job succeeds, saves the new one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      # The runner image already ships a Node with fetch; the script needs nothing else.
      - run: node scripts/indexnow.mjs
        env:
          INDEXNOW_ALL: ${{ inputs.all }}
          INDEXNOW_STATE: .indexnow/sitemap.json
          INDEXNOW_WAIT_FOR: ${{ github.event_name == 'push' && github.sha || '' }}
